<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mortagotchi</title>
<style>
  :root {
    --bg: #2f2738;
    --shell: #e8a0b4;
    --shell-dark: #c97690;
    --lcd-bg: #9bbc0f;
    --lcd-ink: #0f380f;
    --ink: #2b2230;
    --muted: #6d6170;
    --track: #fbf6f0;
    --fill: #3f7d5a;
    --fill-low: #c2453d;
    --fill-mid: #d9a21b;
    --magnum: #2b2230;
    --danger: #c2453d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 16px;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .device {
    width: 100%;
    max-width: 360px;
    padding: 20px 18px 22px;
    position: relative;
    isolation: isolate;
    margin-bottom: 18px;
    /* luce dall'alto a sinistra, plastica più scura sui bordi */
    background: radial-gradient(120% 90% at 30% 15%, #f7c6d4 0%, var(--shell) 45%, #d6869e 100%);
    border-radius: 48% 48% 40% 40% / 30% 30% 22% 22%;
    box-shadow:
      inset 6px 8px 12px rgba(255, 255, 255, 0.45),
      inset -10px -14px 22px rgba(120, 40, 70, 0.5),
      0 10px 0 #a2546e,
      0 30px 42px rgba(0, 0, 0, 0.65);
  }
  /* riflesso lucido sulla plastica */
  .device::before {
    content: "";
    position: absolute;
    z-index: -1;
    top: 4%;
    left: 10%;
    width: 45%;
    height: 22%;
    border-radius: 50%;
    background: radial-gradient(closest-side, rgba(255, 255, 255, 0.5), transparent);
    pointer-events: none;
  }
  /* Tasti fisici del device: plastica con ombra che si abbassa alla pressione. */
  .key {
    display: grid;
    place-items: center;
    padding: 0;
    border: 2px solid var(--ink);
    /* tasto bombato: luce in alto a sinistra */
    background: radial-gradient(circle at 35% 30%, #fff 0%, var(--track) 45%, #e6d4ca 100%);
    color: var(--ink);
    box-shadow: 0 5px 0 var(--shell-dark), 0 8px 10px rgba(0, 0, 0, 0.35);
    cursor: pointer;
    transition: transform 60ms, box-shadow 60ms;
  }
  .key:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--shell-dark), 0 2px 3px rgba(0, 0, 0, 0.35); }
  .key:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .key:disabled { opacity: 0.4; cursor: not-allowed; }
  /* marchio inciso nella plastica */
  .logo {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: 5px;
    margin: 6px 0 0;
    color: #9c4a65;
  }
  .logo svg { width: auto; height: 12px; filter: drop-shadow(0 1px 0 rgba(255, 255, 255, 0.6)); }
  .logo .logo-stone { height: 16px; } /* lapidina: 8 pixel contro i 6 della scritta */
  .difficulty {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin: 8px 0 12px;
  }
  .difficulty .key { width: 34px; height: 24px; border-radius: 999px; }
  .difficulty svg { width: 16px; height: 14px; }
  .difficulty .key[aria-pressed="true"] {
    background: var(--ink);
    color: var(--track);
    transform: translateY(2px);
    box-shadow: 0 1px 0 var(--shell-dark);
  }
  .lcd-frame {
    width: 70%;
    margin: 0 auto;
    position: relative;
    padding: 8px;
    /* schermo incassato nel guscio */
    background: linear-gradient(#433d49, #6a6370);
    border-radius: 14px;
    box-shadow:
      inset 0 4px 8px rgba(0, 0, 0, 0.75),
      inset 0 -2px 0 rgba(255, 255, 255, 0.15),
      0 2px 0 rgba(255, 255, 255, 0.5);
  }
  /* vetro: ombra interna e riflesso sopra il canvas */
  .lcd-frame::after {
    content: "";
    position: absolute;
    inset: 8px;
    border-radius: 4px;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.22), transparent 40%);
    box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.45);
    pointer-events: none;
  }
  #lcd {
    display: block;
    width: 100%;
    max-width: 100%;
    aspect-ratio: 3 / 2;
    background: var(--lcd-bg);
    border-radius: 4px;
    image-rendering: pixelated;
  }
  .bars { margin: 14px 4px 0; display: grid; gap: 8px; }
  .bar-row {
    display: grid;
    grid-template-columns: 20px 1fr 30px;
    align-items: center;
    gap: 8px;
    font: 700 12px/1 ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  .stat-icon { display: grid; place-items: center; }
  .stat-icon svg { width: 18px; height: 18px; }
  .bar-row .val { text-align: right; font-variant-numeric: tabular-nums; }
  .bar {
    position: relative;
    height: 14px;
    background: var(--track);
    border: 2px solid var(--ink);
    box-shadow: 2px 2px 0 var(--ink);
  }
  /* 10 segmenti, come una barra della vita retrò */
  .bar::after {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 2px), var(--ink) calc(10% - 2px) 10%);
    opacity: 0.35;
  }
  .bar .fill {
    height: 100%;
    background: var(--fill);
    box-shadow: inset 0 3px 0 rgba(255, 255, 255, 0.35);
  }
  .bar .fill.mid { background: var(--fill-mid); }
  .bar .fill.low { background: var(--fill-low); animation: low-pulse 1s steps(1) infinite; }
  @keyframes low-pulse { 50% { opacity: 0.55; } }
  /* zona oltre il tetto: irraggiungibile, tratteggiata */
  .bar .lost {
    position: absolute;
    top: 0;
    bottom: 0;
    right: 0;
    background: repeating-linear-gradient(45deg, var(--ink) 0 2px, transparent 2px 5px);
    opacity: 0.45;
  }
  .bar .cap { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--ink); z-index: 1; }
  .warning {
    margin: 12px 0 0;
    padding: 4px 8px;
    background: var(--track);
    border-radius: 8px;
    text-align: center;
    color: var(--danger);
  }
  .warning svg { display: block; width: auto; height: 15px; max-width: 100%; margin: 0 auto; }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
  /* Zona tasti ad altezza fissa: il device non cambia grandezza tra uno stato e l'altro. */
  .controls {
    height: 96px;
    margin-top: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .actions { display: flex; justify-content: center; gap: 12px; }
  .actions .key { width: 44px; height: 44px; border-radius: 50%; }
  .actions svg { width: 22px; height: 22px; }
  .magnum { margin-top: 12px; }
  .magnum { width: 72px; height: 40px; border-radius: 999px; background: radial-gradient(circle at 35% 30%, #5d4d66 0%, var(--magnum) 60%); color: var(--track); }
  .magnum svg { width: 32px; height: 20px; }
  .magnum.blink { animation: blink 0.7s steps(1) infinite; }
  @keyframes blink { 50% { background: var(--danger); } }
  .reborn { width: 52px; height: 52px; border-radius: 50%; }
  .reborn svg { width: 26px; height: 26px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main class="device">
  <h1 class="logo" id="logo" aria-label="Mortagotchi"></h1>
  <div class="difficulty" role="group" aria-label="Difficoltà">
    <button type="button" class="key" data-difficulty="facile" data-icon="liv1" aria-label="Facile" title="Facile"></button>
    <button type="button" class="key" data-difficulty="normale" data-icon="liv2" aria-label="Normale" title="Normale"></button>
    <button type="button" class="key" data-difficulty="difficile" data-icon="liv3" aria-label="Difficile" title="Difficile"></button>
  </div>
  <div class="lcd-frame"><canvas id="lcd" width="288" height="192"></canvas></div>
  <div class="bars">
    <div class="bar-row"><span class="stat-icon" data-icon="cibo" role="img" aria-label="Fame" title="Fame"></span><div class="bar" data-stat="fame"><div class="fill"></div><div class="lost"></div><div class="cap"></div></div><span class="val">100</span></div>
    <div class="bar-row"><span class="stat-icon" data-icon="palla" role="img" aria-label="Felicità" title="Felicità"></span><div class="bar" data-stat="felicita"><div class="fill"></div><div class="lost"></div><div class="cap"></div></div><span class="val">100</span></div>
    <div class="bar-row"><span class="stat-icon" data-icon="zzz" role="img" aria-label="Energia" title="Energia"></span><div class="bar" data-stat="energia"><div class="fill"></div><div class="lost"></div><div class="cap"></div></div><span class="val">100</span></div>
    <div class="bar-row"><span class="stat-icon" data-icon="bolle" role="img" aria-label="Pulizia" title="Pulizia"></span><div class="bar" data-stat="pulizia"><div class="fill"></div><div class="lost"></div><div class="cap"></div></div><span class="val">100</span></div>
  </div>
  <p class="warning" id="warning"><span class="sr-only">Non c'è più niente da fare…</span></p>
  <div class="controls">
  <div class="actions" id="actions">
    <button type="button" class="key" data-action="mangia" data-icon="cibo" aria-label="Mangia" title="Mangia"></button>
    <button type="button" class="key" data-action="gioca" data-icon="palla" aria-label="Gioca" title="Gioca"></button>
    <button type="button" class="key" data-action="riposa" data-icon="zzz" aria-label="Riposa" title="Riposa"></button>
    <button type="button" class="key" data-action="lava" data-icon="bolle" aria-label="Lava" title="Lava"></button>
  </div>
  <button type="button" class="key magnum" id="magnum" data-icon="magnum" aria-label="Magnum" title="Magnum"></button>
  <button type="button" class="key reborn" id="reborn" data-icon="uovo" aria-label="Nuova creatura" title="Nuova creatura" hidden></button>
  </div>
</main>
<script id="logic">
// Logica di gioco: funzioni pure, nessun accesso al DOM.
const LIFESPAN = { facile: 7200, normale: 1440, difficile: 240 };
const STAT_KEYS = ["fame", "felicita", "energia", "pulizia"];
// Quante volte ogni statistica si svuota in una vita massima: la fame sei, l'energia due.
const DECAY_RATE = { fame: 6, felicita: 3, pulizia: 2.5, energia: 2 };
// Quante volte l'energia si riempie dormendo in una vita massima.
const SLEEP_RATE = 8;
const MAX_TICK_SECONDS = 60;

function newPet(difficulty) {
  return {
    stats: { fame: 100, felicita: 100, energia: 100, pulizia: 100 },
    cap: 100,
    difficulty,
    alive: true,
    asleep: false,
  };
}

function tick(state, seconds) {
  if (!state.alive) return state;
  const s = Math.min(Math.max(seconds, 0), MAX_TICK_SECONDS);
  if (s === 0) return state;
  const L = LIFESPAN[state.difficulty];
  const cap = Math.max(0, state.cap - (70 * s) / L);
  const stats = {};
  for (const k of STAT_KEYS) {
    stats[k] = Math.min(cap, Math.max(0, state.stats[k] - (DECAY_RATE[k] * 100 * s) / L));
  }
  if (!state.asleep) return { ...state, stats, cap };
  // Nel sonno l'energia sale invece di scendere; quando arriva al tetto si sveglia.
  stats.energia = Math.min(cap, state.stats.energia + (SLEEP_RATE * 100 * s) / L);
  return { ...state, stats, cap, asleep: stats.energia < cap };
}

function setDifficulty(state, difficulty) {
  return { ...state, difficulty };
}

const ACTION_STAT = { mangia: "fame", gioca: "felicita", riposa: "energia", lava: "pulizia" };
const ACTION_BOOST = 30;
const FORCED_THRESHOLD = 30;

function isForced(state) {
  return STAT_KEYS.every((k) => state.stats[k] < FORCED_THRESHOLD);
}

// Si addormenta solo se viva, sveglia, non obbligata e con l'energia sotto il tetto.
function sleep(state) {
  if (!state.alive || state.asleep || isForced(state) || state.stats.energia >= state.cap) return state;
  return { ...state, asleep: true };
}

function act(state, action) {
  if (action === "riposa") return sleep(state);
  if (!state.alive || state.asleep || isForced(state)) return state;
  const k = ACTION_STAT[action];
  const value = Math.min(state.cap, state.stats[k] + ACTION_BOOST);
  return { ...state, stats: { ...state.stats, [k]: value } };
}

function mood(state) {
  if (isForced(state)) return "agonizzante";
  return STAT_KEYS.every((k) => state.stats[k] >= 50) ? "felice" : "triste";
}

// Reazione da mostrare quando l'umore cambia, scelta in base al nuovo umore.
const REACTION = { triste: "lacrima", felice: "cuoricino", agonizzante: "teschio" };

function reactionFor(prima, dopo) {
  return prima === dopo ? null : REACTION[dopo];
}

function shoot(state) {
  if (!state.alive) return state;
  return { ...state, alive: false, asleep: false };
}

const SAVE_KEY = "tamagotchi-save";

function serialize(state) {
  return JSON.stringify(state);
}

function isPercent(v) {
  return typeof v === "number" && Number.isFinite(v) && v >= 0 && v <= 100;
}

// Restituisce lo stato salvato se valido, altrimenti una nuova creatura. Mai eccezioni.
function parseSave(text) {
  let data;
  try {
    data = JSON.parse(text);
  } catch {
    return newPet("normale");
  }
  const valid =
    data !== null && typeof data === "object" &&
    data.stats !== null && typeof data.stats === "object" &&
    STAT_KEYS.every((k) => isPercent(data.stats[k])) &&
    isPercent(data.cap) &&
    typeof data.difficulty === "string" && Object.hasOwn(LIFESPAN, data.difficulty) &&
    typeof data.alive === "boolean" &&
    (data.asleep === undefined || typeof data.asleep === "boolean");
  if (!valid) return newPet("normale");
  const stats = {};
  for (const k of STAT_KEYS) stats[k] = Math.min(data.stats[k], data.cap);
  return { stats, cap: data.cap, difficulty: data.difficulty, alive: data.alive, asleep: data.alive && data.asleep === true };
}
</script>
<script id="sprites">
// Pixel art: ogni sprite è un array di stringhe, "#" = pixel acceso, "." = spento.
const PX = 6; // un pixel logico; schermo logico 48×32
const LCD_BG = "#9bbc0f";
const LCD_INK = "#0f380f";

// Accende i pixel "#" di ogni [riga, colonna, stringa] sopra lo sprite base.
function overlay(base, parts) {
  const rows = base.map((r) => r.split(""));
  for (const [row, col, s] of parts) {
    [...s].forEach((ch, i) => { if (ch === "#") rows[row][col + i] = "#"; });
  }
  return rows.map((r) => r.join(""));
}

const shiftDown = (s) => [".".repeat(s[0].length), ...s.slice(0, -1)];
const shiftRight = (s) => s.map((r) => "." + r.slice(0, -1));

const BODY = [
  "................",
  ".....######.....",
  "...##......##...",
  "..#..........#..",
  ".#............#.",
  ".#............#.",
  "#..............#",
  "#..............#",
  "#..............#",
  "#..............#",
  "#..............#",
  ".#............#.",
  ".#............#.",
  "..##........##..",
  "....########....",
  "................",
];

const EYES = [[6, 4, "##"], [7, 4, "##"], [6, 10, "##"], [7, 10, "##"]];
const EYES_HAPPY = [[6, 4, "##"], [7, 3, "#..#"], [6, 10, "##"], [7, 9, "#..#"]];
const SMILE = [[9, 5, "#....#"], [10, 6, "####"]];
const FROWN = [[9, 6, "####"], [10, 5, "#....#"]];
const EYES_UP = [[5, 4, "##"], [6, 4, "##"], [5, 10, "##"], [6, 10, "##"]];
const EYES_CLOSED = [[7, 3, "###"], [7, 10, "###"]];
const MOUTH_OPEN = [[9, 6, "####"], [10, 6, "#..#"], [11, 6, "####"]];
const CHEW = [[10, 6, "####"]];
const SMALL_O = [[9, 7, "##"], [10, 7, "##"]];
const YAWN = [[9, 6, "####"], [10, 6, "#..#"], [11, 6, "#..#"], [12, 6, "####"]];
const SLEEP_MOUTH = [[10, 7, "##"]];

function breathing(face) {
  const a = overlay(BODY, face);
  return [a, shiftDown(a)];
}

// Lettere 5 righe affiancate con una colonna vuota fra l'una e l'altra.
function joinGlyphs(glyphs) {
  return glyphs[0].map((_, r) => glyphs.map((g) => g[r]).join("."));
}

const TERRORIZZATA = overlay(BODY, [
  [4, 3, "###"], [5, 3, "#.#"], [6, 3, "###"],
  [4, 10, "###"], [5, 10, "#.#"], [6, 10, "###"],
  [9, 6, ".##."], [10, 6, "#..#"], [11, 6, "#..#"], [12, 6, ".##."],
]);

const SPRITES = {
  terrorizzata: [TERRORIZZATA, shiftDown(TERRORIZZATA)],
  magnum: [
    ".#...........#..",
    "###############.",
    "#.........######",
    "###############.",
    "..........######",
    "..........#..###",
    "...........##.##",
    "..............##",
    ".............###",
    ".............###",
  ],
  bang: joinGlyphs([
    ["##.", "#.#", "##.", "#.#", "##."],
    [".#.", "#.#", "###", "#.#", "#.#"],
    ["#..#", "##.#", "#.##", "#..#", "#..#"],
    [".##", "#..", "#.#", "#.#", ".##"],
    ["#", "#", "#", ".", "#"],
  ]),
  felice: breathing([...EYES, ...SMILE]),
  triste: breathing([...EYES, ...FROWN, [8, 3, "#"]]),
  agonizzante: breathing([
    [5, 3, "#.#"], [6, 3, ".#."], [7, 3, "#.#"],
    [5, 10, "#.#"], [6, 10, ".#."], [7, 10, "#.#"],
    [10, 5, "#.#.#."], [11, 6, "#.#.#"],
  ]),
  lapide: [
    "................",
    ".....######.....",
    "....#......#....",
    "...#........#...",
    "...#...##...#...",
    "...#..####..#...",
    "...#...##...#...",
    "...#...##...#...",
    "...#........#...",
    "...#........#...",
    "...#........#...",
    "...#........#...",
    "...#........#...",
    ".##############.",
    ".#.#..#..#..#.#.",
    "################",
  ],
  cibo: [
    "....#...",
    "...#....",
    ".##.##..",
    "#######.",
    "#######.",
    "#######.",
    ".#####..",
    "..#.#...",
  ],
  palla: [
    "..####..",
    ".#....#.",
    "#.##...#",
    "#.#....#",
    "#......#",
    "#.....##",
    ".#..###.",
    "..####..",
  ],
  zzz: [
    "....####",
    "......#.",
    ".....#..",
    "....####",
    "###.....",
    "..#.....",
    ".#......",
    "###.....",
  ],
  bolle: [
    ".##.....",
    "#..#..#.",
    "#..#.#.#",
    ".##...#.",
    "....##..",
    "...#..#.",
    "...#..#.",
    "....##..",
  ],
};

// Reazioni ai cambi d'umore.
SPRITES.afflitta = overlay(BODY, [...EYES, ...FROWN]); // triste, senza la lacrima
SPRITES.gioia = overlay(BODY, [...EYES_HAPPY, ...SMILE]);
SPRITES.cuore = [".#.#.", "#####", "#####", ".###.", "..#.."];
SPRITES.teschio = [".#####.", "#######", "#..#..#", "#######", ".#####.", ".#.#.#."];
SPRITES.fumetto = [
  "..#########..",
  ".#.........#.",
  "#...........#",
  "#...........#",
  "#...........#",
  "#...........#",
  "#...........#",
  "#...........#",
  ".#.........#.",
  "..#########..",
];

// Cure animate.
SPRITES.affamata = overlay(BODY, [...EYES_UP, ...MOUTH_OPEN]);
SPRITES.bocconeChiuso = overlay(BODY, [...EYES_HAPPY, ...CHEW]);
SPRITES.bocconeO = overlay(BODY, [...EYES_HAPPY, ...SMALL_O]);
SPRITES.doccia = overlay(BODY, [...EYES_CLOSED, ...SMILE]);
SPRITES.ciboPiccolo = ["..#.", "####", "####", ".##."];
SPRITES.scintilla = [".#.", "###", ".#."];

// Sonno: notte stellata.
SPRITES.sbadiglio = overlay(BODY, [...EYES_CLOSED, ...YAWN]);
SPRITES.dorme = overlay(BODY, [...EYES_CLOSED, ...SLEEP_MOUTH]);
SPRITES.luna = [".###", "##..", "#...", "#...", "##..", ".###"];
SPRITES.sole = ["#..#..#", ".#####.", ".#...#.", "##...##", ".#...#.", ".#####.", "#..#..#"];
SPRITES.zeta = ["####", "..#.", ".#..", "####"];

// Nascita: uovo grande, poi crepato a zigzag fra la riga 6 e la 7.
SPRITES.uovoGrande = [
  "....####....",
  "..##....##..",
  ".#........#.",
  ".#..#.....#.",
  "#..........#",
  "#.......#..#",
  "#..#.......#",
  "#..........#",
  "#.....#....#",
  ".#........#.",
  ".#........#.",
  "..##....##..",
  "....####....",
];
SPRITES.uovoCrepato = overlay(SPRITES.uovoGrande, [[6, 1, "#...#...#."], [7, 1, ".#.#.#.#.#"]]);

// Icone dei tasti: livelli di difficoltà come le tacche del segnale.
SPRITES.lapidina = [
  "..###..",
  ".#...#.",
  "#..#..#",
  "#.###.#",
  "#..#..#",
  "#..#..#",
  "#.....#",
  "#######",
];
SPRITES.uovo = [
  "...##...",
  "..#..#..",
  ".#....#.",
  ".#.#..#.",
  "#....#.#",
  "#.#....#",
  ".#....#.",
  "..####..",
];
SPRITES.liv1 = ["........", "........", "........", "........", "........", "##......", "##......"];
SPRITES.liv2 = ["........", "........", "........", "...##...", "...##...", "##.##...", "##.##..."];
SPRITES.liv3 = ["......##", "......##", "......##", "...##.##", "...##.##", "##.##.##", "##.##.##"];

// Alfabeto pixel 3×5 con una riga in cima per gli accenti; solo le lettere che servono.
const NO_ACCENT = "...";
const PIXEL_FONT = {
  A: [NO_ACCENT, ".#.", "#.#", "###", "#.#", "#.#"],
  C: [NO_ACCENT, ".##", "#..", "#..", "#..", ".##"],
  D: [NO_ACCENT, "##.", "#.#", "#.#", "#.#", "##."],
  E: [NO_ACCENT, "###", "#..", "##.", "#..", "###"],
  È: ["#..", "###", "#..", "##.", "#..", "###"],
  F: [NO_ACCENT, "###", "#..", "##.", "#..", "#.."],
  G: [NO_ACCENT, ".##", "#..", "#.#", "#.#", ".##"],
  H: [NO_ACCENT, "#.#", "#.#", "###", "#.#", "#.#"],
  I: [NO_ACCENT, "###", ".#.", ".#.", ".#.", "###"],
  M: [NO_ACCENT, "#.#", "###", "###", "#.#", "#.#"],
  N: [NO_ACCENT, "##.", "#.#", "#.#", "#.#", "#.#"],
  O: [NO_ACCENT, ".#.", "#.#", "#.#", "#.#", ".#."],
  P: [NO_ACCENT, "##.", "#.#", "##.", "#..", "#.."],
  R: [NO_ACCENT, "##.", "#.#", "##.", "#.#", "#.#"],
  T: [NO_ACCENT, "###", ".#.", ".#.", ".#.", ".#."],
  U: [NO_ACCENT, "#.#", "#.#", "#.#", "#.#", "###"],
  Ù: ["#..", "#.#", "#.#", "#.#", "#.#", "###"],
  "'": [".", "#", "#", ".", ".", "."],
  ".": [".", ".", ".", ".", ".", "#"],
  " ": ["..", "..", "..", "..", "..", ".."],
};

function pixelText(text) {
  const glyphs = [...text].map((ch) => {
    if (!PIXEL_FONT[ch]) throw new Error("carattere senza glifo: " + ch);
    return PIXEL_FONT[ch];
  });
  return glyphs[0].map((_, r) => glyphs.map((g) => g[r]).join("."));
}

// Affianca due sprite con gap colonne vuote, allineandoli in basso.
function besideSprite(a, b, gap) {
  const h = Math.max(a.length, b.length);
  const pad = (s, rows) => [...Array(rows - s.length).fill(".".repeat(s[0].length)), ...s];
  const pa = pad(a, h), pb = pad(b, h);
  return pa.map((row, i) => row + ".".repeat(gap) + pb[i]);
}

// Piastrella a mattoni: lo sprite, e sotto una copia sfalsata di mezza piastrella.
function tileSprite(sprite, gapX, gapY) {
  const w = sprite[0].length + gapX;
  const h = sprite.length + gapY;
  const grid = Array.from({ length: 2 * h }, () => Array(w).fill("."));
  const stamp = (ox, oy) => sprite.forEach((row, y) => {
    [...row].forEach((ch, x) => { if (ch === "#") grid[oy + y][(ox + x) % w] = "#"; });
  });
  stamp(0, 0);
  stamp(Math.floor(w / 2), h);
  return grid.map((r) => r.join(""));
}

// Sprite → SVG con un rettangolo per pixel, colorato con currentColor o con fill.
function iconSvg(sprite, fill = "currentColor") {
  let rects = "";
  sprite.forEach((row, y) => {
    for (let x = 0; x < row.length; x++) {
      if (row[x] === "#") rects += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
    }
  });
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${sprite[0].length} ${sprite.length}" fill="${fill}" shape-rendering="crispEdges" aria-hidden="true">${rects}</svg>`;
}

// maxY: le righe più in basso non si disegnano (per sprofondare o spuntare dal terreno).
// color: LCD_BG per disegnare chiaro sullo schermo buio.
function drawSprite(ctx, sprite, x, y, maxY = Infinity, color = LCD_INK) {
  ctx.fillStyle = color;
  sprite.forEach((row, r) => {
    if (y + r > maxY) return;
    for (let c = 0; c < row.length; c++) {
      if (row[c] === "#") ctx.fillRect((x + c) * PX, (y + r) * PX, PX, PX);
    }
  });
}

function fillLcd(ctx, color) {
  ctx.fillStyle = color;
  ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);
}

const clearLcd = (ctx) => fillLcd(ctx, LCD_BG);

// Sequenza dello sparo, in ms dall'inizio.
const SHOT_GUN_MS = 1000;
const SHOT_FLASH_MS = 1200;
const SHOT_END_MS = 2200;

// Disegna la sequenza dello sparo; restituisce false quando è finita.
function drawShot(ctx, t) {
  t = Math.max(0, t); // il frame può essere iniziato poco prima del click
  if (t < SHOT_GUN_MS) {
    const frame = Math.floor(t / 80) % 2;
    drawSprite(ctx, SPRITES.terrorizzata[frame], 16 - frame, 8);
    drawSprite(ctx, SPRITES.magnum, Math.round(48 - (16 * t) / SHOT_GUN_MS), 10);
  } else if (t < SHOT_FLASH_MS) {
    ctx.fillStyle = LCD_INK;
    ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);
  } else if (t < SHOT_END_MS) {
    drawSprite(ctx, SPRITES.lapide, 16, 8);
    drawSprite(ctx, SPRITES.bang, 15, 1);
  } else {
    return false;
  }
  return true;
}

const dot = (ctx, x, y) => drawSprite(ctx, ["#"], x, y);
const arc = (q, h) => Math.round(4 * q * (1 - q) * h); // altezza di un salto: 0 agli estremi, h a metà

// La creatura che dorme, chiara sullo schermo buio.
function drawAsleepDark(ctx, sprite) {
  fillLcd(ctx, LCD_INK);
  drawSprite(ctx, sprite, 16, 8, Infinity, LCD_BG);
}

const EGG_X = 18, EGG_Y = 10, GROUND = 23;
const lerp = (a, b, k) => Math.round(a + (b - a) * Math.min(1, Math.max(0, k)));
const wobble = (t) => [0, 1, 0, -1][Math.floor(t / 90) % 4];

// Uovo che dondola, si crepa e si apre; t in ms dall'inizio della schiusa (sempre >= 300).
function drawHatch(ctx, t) {
  if (t < 400) return drawSprite(ctx, SPRITES.uovoGrande, EGG_X + wobble(t), EGG_Y);
  if (t < 650) return drawSprite(ctx, SPRITES.uovoCrepato, EGG_X + wobble(t * 2), EGG_Y);
  if (t < 900) {
    const k = (t - 650) / 250;
    drawSprite(ctx, SPRITES.uovoCrepato.slice(0, 7), EGG_X - lerp(0, 8, k), EGG_Y - lerp(0, 10, k));
    drawSprite(ctx, SPRITES.uovoCrepato.slice(7), EGG_X + lerp(0, 8, k), EGG_Y + 7 + lerp(0, 3, k));
    for (const [x, y] of [[22, 4], [33, 12], [12, 14]]) drawSprite(ctx, SPRITES.scintilla, x, y);
    return;
  }
  drawSprite(ctx, SPRITES.gioia, 16, t < 1000 ? 6 : 8);
}

// Ogni animazione disegna tutta la scena all'istante t (ms dall'inizio, anche un po' negativo).
const ANIMATIONS = {
  sparo: { kind: "sparo", ms: SHOT_END_MS, draw: (ctx, t) => drawShot(ctx, t) },
  // Dalla tomba: la lapide sprofonda, dallo stesso punto spunta l'uovo e si schiude.
  nascita: {
    kind: "nascita",
    ms: 1500,
    draw(ctx, t) {
      for (let x = 12; x < 36; x++) if (x % 3) dot(ctx, x, GROUND + 1);
      if (t < 350) drawSprite(ctx, SPRITES.lapide, 16, lerp(8, GROUND + 1, t / 350), GROUND);
      else if (t < 600) drawSprite(ctx, SPRITES.uovoGrande, EGG_X, lerp(GROUND + 1, EGG_Y, (t - 350) / 250), GROUND);
      else drawHatch(ctx, 300 + (t - 600) * 1.3);
    },
  },
  // Al volo: guarda in alto, il cibo cade in bocca, mastica e fa un saltello.
  mangia: {
    kind: "cura",
    ms: 1000,
    draw(ctx, t) {
      if (t < 450) {
        drawSprite(ctx, SPRITES.affamata, 16, 8);
        drawSprite(ctx, SPRITES.ciboPiccolo, 22, Math.round(-4 + (t / 450) * 19));
      } else if (t < 850) {
        const chiusa = Math.floor((t - 450) / 100) % 2 === 1;
        drawSprite(ctx, chiusa ? shiftDown(SPRITES.bocconeChiuso) : SPRITES.bocconeO, 16, 8);
      } else {
        drawSprite(ctx, SPRITES.gioia, 16, 6);
      }
    },
  },
  // Calcio: rincorsa, calcio, la palla vola fuori dallo schermo, esulta.
  gioca: {
    kind: "cura",
    ms: 1000,
    draw(ctx, t) {
      if (t < 800) drawSprite(ctx, SPRITES.felice[0], t < 250 ? 14 : t < 500 ? 17 : 16, 8);
      else drawSprite(ctx, SPRITES.gioia, 16, t < 900 ? 5 : 7);
      if (t < 300) {
        drawSprite(ctx, SPRITES.palla, 32, 15);
      } else {
        const q = (t - 300) / 500;
        if (q <= 1) drawSprite(ctx, SPRITES.palla, 32 + Math.round(q * 20), 15 - arc(q, 14));
      }
    },
  },
  // Doccia: gocce dall'alto, poi si asciuga e brilla.
  lava: {
    kind: "cura",
    ms: 1000,
    draw(ctx, t) {
      if (t >= 750) {
        drawSprite(ctx, SPRITES.felice[0], 16, 8);
        if (t % 200 < 150) {
          drawSprite(ctx, SPRITES.scintilla, 34, 6);
          drawSprite(ctx, SPRITES.scintilla, 11, 10);
        }
        return;
      }
      drawSprite(ctx, SPRITES.doccia, 16, 8);
      for (const [x, off] of [[13, 0], [17, 5], [20, 2], [23, 7], [26, 3], [29, 6], [34, 1]]) {
        const limit = x < 16 || x > 31 ? 22 : 7; // sulla testa si fermano prima
        const y = Math.floor((t * 0.05 + off * 2) % (limit + 3)) - 2;
        if (y <= limit) drawSprite(ctx, ["#", "#"], x, y);
      }
    },
  },
  // Si addormenta: sbadiglio, occhi chiusi, poi lo schermo diventa notte.
  riposa: {
    kind: "cura",
    ms: 1000,
    draw(ctx, t) {
      if (t < 700) drawSprite(ctx, t < 400 ? SPRITES.sbadiglio : SPRITES.dorme, 16, 8);
      else drawAsleepDark(ctx, SPRITES.dorme);
    },
  },
  // Si sveglia: torna la luce, sorge il sole, si stiracchia e mostra il suo umore.
  risveglio: {
    kind: "cura",
    ms: 1000,
    draw(ctx, t, umore) {
      if (t < 150) return drawAsleepDark(ctx, SPRITES.dorme);
      drawSprite(ctx, SPRITES.sole, 3, lerp(-7, 2, (t - 150) / 600));
      if (t < 500) drawSprite(ctx, SPRITES.dorme, 16, 7);
      else drawSprite(ctx, SPRITES[umore][0], 16, t < 650 ? 6 : 8);
    },
  },
  lacrima: {
    kind: "reazione",
    ms: 1000,
    draw(ctx, t) {
      drawSprite(ctx, shiftDown(SPRITES.afflitta), 16, 8);
      const y = 17 + Math.floor(t / 110); // scende dalla guancia
      if (y <= 30) {
        dot(ctx, 19, y);
        if (y > 22) dot(ctx, 19, y - 1);
      }
    },
  },
  cuoricino: {
    kind: "reazione",
    ms: 1000,
    draw(ctx, t) {
      drawSprite(ctx, SPRITES.gioia, 16, 8);
      const blink = t >= 600 && Math.floor(t / 120) % 4 === 3;
      if (!blink) drawSprite(ctx, SPRITES.cuore, 22 + (Math.floor(t / 200) % 2), Math.round(8 - (t / 1000) * 9));
    },
  },
  teschio: {
    kind: "reazione",
    ms: 1000,
    draw(ctx, t) {
      drawSprite(ctx, SPRITES.agonizzante[0], 16, 8);
      if (t > 100) dot(ctx, 31, 9);
      if (t > 200) { dot(ctx, 32, 6); dot(ctx, 33, 6); }
      if (t > 300) {
        drawSprite(ctx, SPRITES.fumetto, 34, 0);
        drawSprite(ctx, SPRITES.teschio, 37, 2);
      }
    },
  },
};

// Stelle della notte: [x, y, gruppo]; i due gruppi si alternano fra puntino e stellina.
const STARS = [[4, 3, 0], [10, 7, 1], [27, 2, 0], [36, 9, 1], [6, 14, 1], [44, 13, 0]];

// La notte stellata, disegnata finché la creatura dorme.
function drawSleep(ctx, now) {
  fillLcd(ctx, LCD_INK);
  drawSprite(ctx, SPRITES.luna, 41, 2, Infinity, LCD_BG);
  const on = Math.floor(now / 400) % 2;
  for (const [x, y, group] of STARS) {
    if (group === on) drawSprite(ctx, SPRITES.scintilla, x - 1, y - 1, Infinity, LCD_BG);
    else drawSprite(ctx, ["#"], x, y, Infinity, LCD_BG);
  }
  const dorme = Math.floor(now / 700) % 2 ? shiftDown(SPRITES.dorme) : SPRITES.dorme;
  drawSprite(ctx, dorme, 16, 8, Infinity, LCD_BG);
  const k = (now % 1200) / 900; // una Z che sale ogni 1,2 s
  if (k <= 1) drawSprite(ctx, SPRITES.zeta, 32 + lerp(0, 4, k), 11 - lerp(0, 8, k), Infinity, LCD_BG);
}

const ANIM_PRIORITY = { sparo: 4, nascita: 3, cura: 2, reazione: 1 };

// L'animazione in corso, oppure null se non c'è o è già finita.
const running = (p, now) => (p.anim && now - p.anim.start < ANIMATIONS[p.anim.name].ms ? p.anim : null);

// Fa partire un'animazione rispettando le priorità; una reazione meno importante va in coda.
function startAnim(player, name, now) {
  const cur = running(player, now);
  const kind = ANIMATIONS[name].kind;
  if (cur && ANIM_PRIORITY[kind] < ANIM_PRIORITY[ANIMATIONS[cur.name].kind]) {
    return { anim: cur, queued: kind === "reazione" ? name : player.queued };
  }
  return { anim: { name, start: now }, queued: kind === "sparo" || kind === "reazione" ? null : player.queued };
}

// Quando l'animazione in corso finisce parte quella in coda; altrimenti restituisce lo stesso player.
function advanceAnim(player, now) {
  if (!player.anim || running(player, now)) return player;
  if (player.queued) return { anim: { name: player.queued, start: now }, queued: null };
  return { anim: null, queued: null };
}

// Disegna la scena corrente; legge state e player dallo script ui.
function drawScene(ctx, now) {
  clearLcd(ctx);
  const next = advanceAnim(player, now);
  if (next !== player) {
    player = next;
    render();
  }
  if (player.anim) {
    ANIMATIONS[player.anim.name].draw(ctx, now - player.anim.start, mood(state));
    return;
  }
  if (!state.alive) {
    drawSprite(ctx, SPRITES.lapide, 16, 8);
    return;
  }
  if (state.asleep) {
    drawSleep(ctx, now);
    return;
  }
  const frame = Math.floor(now / 500) % 2;
  drawSprite(ctx, SPRITES[mood(state)][frame], 16, 8);
}
</script>
<script id="ui">
// Interfaccia: collega la logica al DOM, al timer e al salvataggio.
const ACTION_MS = 1000;

const el = {
  difficulty: document.querySelectorAll("[data-difficulty]"),
  bars: document.querySelectorAll("[data-stat]"),
  warning: document.getElementById("warning"),
  actions: document.getElementById("actions"),
  actionButtons: document.querySelectorAll("[data-action]"),
  magnum: document.getElementById("magnum"),
  reborn: document.getElementById("reborn"),
};

for (const b of document.querySelectorAll("[data-icon]")) {
  b.innerHTML = iconSvg(SPRITES[b.dataset.icon]);
}

el.warning.insertAdjacentHTML("beforeend", iconSvg(pixelText("NON C'È PIÙ NIENTE DA FARE...")));

// Marchio sul guscio e carta da parati dello sfondo con il nome ripetuto.
const WORDMARK = pixelText("MORTAGOTCHI");
document.getElementById("logo").innerHTML =
  iconSvg(WORDMARK) + iconSvg(SPRITES.lapidina).replace("<svg ", "<svg class=\"logo-stone\" ");
const WALL_PX = 4;
const wallTile = tileSprite(besideSprite(WORDMARK, SPRITES.lapidina, 3), 14, 8);
document.body.style.backgroundImage = `url("data:image/svg+xml,${encodeURIComponent(iconSvg(wallTile, "#3b3247"))}")`;
document.body.style.backgroundSize = `${wallTile[0].length * WALL_PX}px ${wallTile.length * WALL_PX}px`;

function readSave() {
  try {
    return localStorage.getItem(SAVE_KEY);
  } catch {
    return null;
  }
}

function save() {
  try {
    localStorage.setItem(SAVE_KEY, serialize(state));
  } catch {}
}

let state = parseSave(readSave());
let busyUntil = 0;
let player = { anim: null, queued: null }; // animazione in corso e reazione in coda
let shownMood = mood(state); // umore già mostrato: un cambio fa partire una reazione
let shownAsleep = state.asleep; // sonno già mostrato: quando finisce parte il risveglio

// Se l'umore è cambiato giocando, fa partire la reazione; nel sonno aspetta il risveglio.
function checkMood(now) {
  if (!state.alive || state.asleep) return;
  const reaction = reactionFor(shownMood, mood(state));
  shownMood = mood(state);
  if (reaction) player = startAnim(player, reaction, now);
}

function render() {
  const forced = state.alive && isForced(state);
  const busy = performance.now() < busyUntil;

  for (const b of el.difficulty) {
    b.setAttribute("aria-pressed", String(b.dataset.difficulty === state.difficulty));
  }
  for (const bar of el.bars) {
    const v = state.stats[bar.dataset.stat];
    const fill = bar.querySelector(".fill");
    fill.style.width = v + "%";
    fill.classList.toggle("low", v < FORCED_THRESHOLD);
    fill.classList.toggle("mid", v >= FORCED_THRESHOLD && v < 50);
    bar.querySelector(".lost").style.left = state.cap + "%";
    bar.querySelector(".cap").style.left = state.cap + "%";
    bar.parentElement.querySelector(".val").textContent = Math.round(v);
  }
  el.warning.style.visibility = forced ? "visible" : "hidden"; // occupa sempre il suo spazio
  const hatching = player.anim !== null && player.anim.name === "nascita";
  el.actions.hidden = !state.alive || hatching;
  for (const b of el.actionButtons) {
    const full = b.dataset.action === "riposa" && state.stats.energia >= state.cap; // niente da recuperare
    b.disabled = forced || busy || state.asleep || full;
  }
  el.magnum.hidden = !state.alive || hatching;
  el.magnum.classList.toggle("blink", forced);
  el.reborn.hidden = state.alive || (player.anim !== null && player.anim.name === "sparo");
}

for (const b of el.actionButtons) {
  b.addEventListener("click", () => {
    const t0 = performance.now();
    if (!state.alive || isForced(state) || t0 < busyUntil) return;
    const next = act(state, b.dataset.action);
    if (next === state) return; // azione senza effetto (per esempio Zzz mentre dorme)
    state = next;
    shownAsleep = state.asleep;
    player = startAnim(player, b.dataset.action, t0);
    busyUntil = t0 + ACTION_MS;
    checkMood(t0);
    render();
    save();
  });
}

for (const b of el.difficulty) {
  b.addEventListener("click", () => {
    state = setDifficulty(state, b.dataset.difficulty);
    render();
    save();
  });
}

function onShoot() {
  if (!state.alive) return;
  state = shoot(state);
  save();
  player = startAnim(player, "sparo", performance.now());
  render();
}
el.magnum.addEventListener("click", () => onShoot());

el.reborn.addEventListener("click", () => {
  if (state.alive) return; // l'uovo serve solo da morta
  state = newPet(state.difficulty);
  shownMood = mood(state);
  shownAsleep = state.asleep;
  player = startAnim(player, "nascita", performance.now());
  render();
  save();
});

let last = Date.now();

// Un'altra scheda ha salvato: adotta il suo stato, così una creatura uccisa
// lì non torna in vita qui. Azzerare last evita di contare due volte il tempo.
window.addEventListener("storage", (e) => {
  if (e.key !== SAVE_KEY) return;
  state = parseSave(e.newValue);
  last = Date.now();
  shownMood = mood(state);
  shownAsleep = state.asleep;
  if (!state.alive) player = { anim: null, queued: null };
  render();
});

setInterval(() => {
  const now = Date.now();
  state = tick(state, (now - last) / 1000);
  last = now;
  const t = performance.now();
  if (state.alive && shownAsleep && !state.asleep) player = startAnim(player, "risveglio", t);
  shownAsleep = state.asleep;
  checkMood(t);
  render();
  save();
}, 1000);

const lcd = document.getElementById("lcd").getContext("2d");
function animate(now) {
  drawScene(lcd, now);
  requestAnimationFrame(animate);
}

render();
requestAnimationFrame(animate);
</script>
</body>
